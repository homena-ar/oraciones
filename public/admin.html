<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Oraciones sin respuestas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      font-family: 'Inter', sans-serif;
      color: #fff;
      padding: 0;
    }

    .header {
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 600;
    }

    .badge {
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: #c4a1f7;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .btn-primary {
      background: linear-gradient(135deg, #7c5cbf 0%, #a855f7 100%);
      color: #fff;
    }

    .btn-primary:hover {
      box-shadow: 0 4px 15px rgba(120, 80, 200, 0.4);
      transform: translateY(-1px);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #f87171;
      padding: 6px 12px;
      font-size: 0.78rem;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    .main {
      max-width: 800px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 600;
      color: #c4a1f7;
      font-family: 'Playfair Display', serif;
    }

    .stat-label {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 4px;
      font-weight: 400;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .section-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .prayers-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .prayer-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.2s ease;
    }

    .prayer-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .prayer-text {
      font-weight: 300;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .prayer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .prayer-date {
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.3);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.35);
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.6;
    }

    .empty-state h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 0.9rem;
      font-weight: 300;
    }

    /* QR Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: linear-gradient(135deg, #1a1640 0%, #2d2560 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 40px;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }

    .modal h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      margin-bottom: 8px;
    }

    .modal p {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.85rem;
      font-weight: 300;
      margin-bottom: 24px;
    }

    .qr-image {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      display: inline-block;
      margin-bottom: 20px;
    }

    .qr-image img {
      display: block;
      width: 200px;
      height: 200px;
    }

    .url-display {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      word-break: break-all;
      margin-bottom: 20px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: rgba(255, 255, 255, 0.4);
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .header {
        padding: 16px 20px;
        flex-direction: column;
        gap: 14px;
      }
      .main {
        padding: 24px 16px;
      }
      .prayer-card {
        padding: 20px;
      }
      .modal {
        padding: 28px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <h1>&#128591; Oraciones recibidas</h1>
      <span class="badge" id="count-badge">0</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" onclick="showQR()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Compartir QR
      </button>
      <button class="btn btn-ghost" onclick="loadPrayers()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Actualizar
      </button>
    </div>
  </div>

  <div class="main">
    <div class="stats">
      <div class="stat-card">
        <div class="stat-number" id="total-count">-</div>
        <div class="stat-label">Oraciones recibidas</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="today-count">-</div>
        <div class="stat-label">Hoy</div>
      </div>
    </div>

    <div class="section-header">
      <h2>Todas las oraciones</h2>
    </div>

    <div id="prayers-container">
      <div class="loading">
        <div class="loading-spinner"></div>
        Cargando oraciones...
      </div>
    </div>
  </div>

  <!-- QR Modal -->
  <div class="modal-overlay" id="qr-modal">
    <div class="modal">
      <h3>Compartir enlace</h3>
      <p>Escaneá el código QR o copiá el enlace para compartir</p>
      <div class="qr-image" id="qr-container">
        <div class="loading-spinner" style="margin:20px auto"></div>
      </div>
      <div class="url-display" id="url-display">Cargando...</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="copyUrl()">Copiar enlace</button>
        <button class="btn btn-ghost" onclick="closeQR()">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    let prayers = [];
    let siteUrl = '';

    async function loadPrayers() {
      const container = document.getElementById('prayers-container');
      try {
        const res = await fetch('/api/oraciones');
        prayers = await res.json();
        renderPrayers();
        updateStats();
      } catch (err) {
        container.innerHTML = '<div class="empty-state"><p>Error al cargar las oraciones.</p></div>';
      }
    }

    function renderPrayers() {
      const container = document.getElementById('prayers-container');
      document.getElementById('count-badge').textContent = prayers.length;

      if (prayers.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">&#128588;</div>
            <h3>No hay oraciones todavía</h3>
            <p>Compartí el enlace o QR para que las personas puedan enviar sus oraciones.</p>
          </div>`;
        return;
      }

      container.innerHTML = prayers.map(p => `
        <div class="prayer-card" id="prayer-${p.id}">
          <div class="prayer-text">${escapeHtml(p.texto)}</div>
          <div class="prayer-footer">
            <span class="prayer-date">${formatDate(p.fecha)}</span>
            <button class="btn btn-danger" onclick="deletePrayer(${p.id})">
              Eliminar
            </button>
          </div>
        </div>
      `).join('');
    }

    function updateStats() {
      document.getElementById('total-count').textContent = prayers.length;

      const today = new Date().toISOString().split('T')[0];
      const todayCount = prayers.filter(p => p.fecha.startsWith(today)).length;
      document.getElementById('today-count').textContent = todayCount;
    }

    function formatDate(dateStr) {
      try {
        const d = new Date(dateStr);
        return d.toLocaleDateString('es-AR', {
          day: 'numeric',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch {
        return dateStr;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function deletePrayer(id) {
      if (!confirm('Eliminar esta oración?')) return;
      try {
        await fetch(`/api/oraciones/${id}`, { method: 'DELETE' });
        prayers = prayers.filter(p => p.id !== id);
        renderPrayers();
        updateStats();
      } catch (err) {
        alert('Error al eliminar.');
      }
    }

    async function showQR() {
      document.getElementById('qr-modal').classList.add('active');
      try {
        const res = await fetch('/api/qr');
        const data = await res.json();
        siteUrl = data.url;
        document.getElementById('qr-container').innerHTML = `<img src="${data.qr}" alt="QR Code">`;
        document.getElementById('url-display').textContent = data.url;
      } catch (err) {
        document.getElementById('qr-container').innerHTML = '<p style="padding:20px;color:#999">Error al generar QR</p>';
      }
    }

    function closeQR() {
      document.getElementById('qr-modal').classList.remove('active');
    }

    function copyUrl() {
      if (siteUrl) {
        navigator.clipboard.writeText(siteUrl).then(() => {
          const btn = event.target;
          btn.textContent = 'Copiado!';
          setTimeout(() => btn.textContent = 'Copiar enlace', 2000);
        });
      }
    }

    // Close modal on overlay click
    document.getElementById('qr-modal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeQR();
    });

    // Load on start
    loadPrayers();
  </script>
</body>
</html>
