<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oraciones sin respuestas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0e0e11;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(180, 140, 80, 0.06) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 70%, rgba(140, 100, 60, 0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 44px 36px;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      color: #f5f0e8;
      font-size: 1.75rem;
      font-weight: 400;
      text-align: center;
      margin-bottom: 10px;
      line-height: 1.35;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.35);
      text-align: center;
      font-size: 0.9rem;
      font-weight: 300;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 18px;
      color: #f5f0e8;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 300;
      line-height: 1.7;
      resize: vertical;
      transition: border-color 0.3s ease, background 0.3s ease;
      outline: none;
    }

    textarea::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    textarea:focus {
      border-color: rgba(200, 170, 110, 0.4);
      background: rgba(255, 255, 255, 0.06);
    }

    .char-count {
      text-align: right;
      color: rgba(255, 255, 255, 0.2);
      font-size: 0.75rem;
      margin-top: 8px;
    }

    button {
      width: 100%;
      padding: 14px 28px;
      background: rgba(200, 170, 110, 0.15);
      border: 1px solid rgba(200, 170, 110, 0.25);
      color: #d4bc82;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.01em;
    }

    button:hover:not(:disabled) {
      background: rgba(200, 170, 110, 0.22);
      border-color: rgba(200, 170, 110, 0.35);
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .privacy-note {
      color: rgba(255, 255, 255, 0.18);
      font-size: 0.75rem;
      text-align: center;
      margin-top: 20px;
      font-weight: 300;
    }

    .success-message {
      display: none;
      text-align: center;
      padding: 36px 16px;
    }

    .success-message .check {
      font-size: 32px;
      margin-bottom: 16px;
      opacity: 0.8;
    }

    .success-message h2 {
      font-family: 'DM Serif Display', serif;
      color: #f5f0e8;
      font-size: 1.3rem;
      font-weight: 400;
      margin-bottom: 8px;
    }

    .success-message p {
      color: rgba(255, 255, 255, 0.35);
      font-weight: 300;
      font-size: 0.9rem;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.5);
      padding: 11px 24px;
      width: auto;
      display: inline-block;
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.7);
    }

    @media (max-width: 520px) {
      .card {
        padding: 32px 24px;
        border-radius: 16px;
      }
      h1 {
        font-size: 1.5rem;
      }
      textarea {
        min-height: 140px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div id="form-view">
        <h1>Oraciones sin respuestas</h1>
        <p class="subtitle">
          Ese pedido que hiciste y sentís que quedó en silencio. Dejalo acá.
        </p>

        <form id="prayer-form">
          <div class="form-group">
            <textarea
              id="prayer-text"
              placeholder="Escribí tu oración..."
              maxlength="2000"
              required
            ></textarea>
            <div class="char-count"><span id="char-count">0</span> / 2000</div>
          </div>
          <button type="submit" id="submit-btn">Enviar</button>
        </form>

        <p class="privacy-note">No se guarda ningún dato personal</p>
      </div>

      <div class="success-message" id="success-view">
        <div class="check">&#10003;</div>
        <h2>Recibida</h2>
        <p>Tu oración fue guardada. Gracias por compartirla.</p>
        <button class="btn-secondary" onclick="resetForm()">Escribir otra</button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('prayer-form');
    const textarea = document.getElementById('prayer-text');
    const charCount = document.getElementById('char-count');
    const submitBtn = document.getElementById('submit-btn');
    const formView = document.getElementById('form-view');
    const successView = document.getElementById('success-view');

    textarea.addEventListener('input', () => {
      charCount.textContent = textarea.value.length;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const texto = textarea.value.trim();
      if (!texto) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando...';

      try {
        const res = await fetch('/api/oraciones', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ texto })
        });

        if (res.ok) {
          formView.style.display = 'none';
          successView.style.display = 'block';
        } else {
          throw new Error('Error');
        }
      } catch (err) {
        alert('Hubo un error al enviar. Intentá de nuevo.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enviar';
      }
    });

    function resetForm() {
      textarea.value = '';
      charCount.textContent = '0';
      successView.style.display = 'none';
      formView.style.display = 'block';
      textarea.focus();
    }
  </script>
</body>
</html>
