<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oraciones sin respuestas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0c0b0f;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Ambient warm glow */
    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .glow-1 {
      width: 500px;
      height: 500px;
      top: -15%;
      left: -10%;
      background: radial-gradient(circle, rgba(200, 150, 60, 0.1) 0%, transparent 70%);
      animation: drift 12s ease-in-out infinite alternate;
    }

    .glow-2 {
      width: 400px;
      height: 400px;
      bottom: -10%;
      right: -10%;
      background: radial-gradient(circle, rgba(180, 120, 80, 0.07) 0%, transparent 70%);
      animation: drift 10s ease-in-out infinite alternate-reverse;
    }

    .glow-3 {
      width: 300px;
      height: 300px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(220, 180, 100, 0.04) 0%, transparent 70%);
      animation: pulse 6s ease-in-out infinite;
    }

    @keyframes drift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(30px, 20px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      animation: fadeUp 0.8s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      padding: 44px 36px;
      position: relative;
      overflow: hidden;
    }

    /* Subtle shimmer on top edge */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 188, 130, 0.3), transparent);
    }

    .icon-row {
      text-align: center;
      margin-bottom: 12px;
    }

    .icon-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(212, 188, 130, 0.08);
      border: 1px solid rgba(212, 188, 130, 0.12);
      font-size: 22px;
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { box-shadow: 0 0 0 0 rgba(212, 188, 130, 0); }
      50% { box-shadow: 0 0 20px 4px rgba(212, 188, 130, 0.06); }
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      color: #f5f0e8;
      font-size: 1.75rem;
      font-weight: 400;
      text-align: center;
      margin-bottom: 10px;
      line-height: 1.35;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.4);
      text-align: center;
      font-size: 0.9rem;
      font-weight: 300;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 18px;
      color: #f5f0e8;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 300;
      line-height: 1.7;
      resize: vertical;
      transition: all 0.35s ease;
      outline: none;
    }

    textarea::placeholder {
      color: rgba(255, 255, 255, 0.18);
      font-style: italic;
    }

    textarea:focus {
      border-color: rgba(212, 188, 130, 0.35);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 30px rgba(212, 188, 130, 0.05), inset 0 0 30px rgba(212, 188, 130, 0.02);
    }

    .textarea-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .privacy-note {
      color: rgba(255, 255, 255, 0.15);
      font-size: 0.72rem;
      font-weight: 300;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .privacy-note svg {
      width: 11px;
      height: 11px;
      opacity: 0.5;
    }

    .char-count {
      color: rgba(255, 255, 255, 0.15);
      font-size: 0.72rem;
      transition: color 0.3s;
    }

    .char-count.active {
      color: rgba(255, 255, 255, 0.3);
    }

    button {
      width: 100%;
      padding: 14px 28px;
      background: linear-gradient(135deg, rgba(200, 170, 100, 0.18), rgba(212, 188, 130, 0.12));
      border: 1px solid rgba(212, 188, 130, 0.22);
      color: #d4bc82;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.01em;
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.04) 50%, transparent 60%);
      transform: translateX(-100%);
      transition: transform 0.5s;
    }

    button:hover:not(:disabled)::before {
      transform: translateX(100%);
    }

    button:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(200, 170, 100, 0.25), rgba(212, 188, 130, 0.18));
      border-color: rgba(212, 188, 130, 0.35);
      box-shadow: 0 4px 24px rgba(200, 170, 100, 0.1);
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Success state */
    .success-message {
      display: none;
      text-align: center;
      padding: 36px 16px;
    }

    .success-message.show {
      display: block;
      animation: fadeUp 0.5s ease-out;
    }

    .success-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(120, 180, 100, 0.1);
      border: 1px solid rgba(120, 180, 100, 0.18);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      animation: successPop 0.4s ease-out 0.1s both;
    }

    @keyframes successPop {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    .success-icon svg {
      width: 24px;
      height: 24px;
      stroke: rgba(140, 200, 120, 0.8);
      stroke-width: 2.5;
      fill: none;
    }

    .success-message h2 {
      font-family: 'DM Serif Display', serif;
      color: #f5f0e8;
      font-size: 1.3rem;
      font-weight: 400;
      margin-bottom: 8px;
    }

    .success-message p {
      color: rgba(255, 255, 255, 0.35);
      font-weight: 300;
      font-size: 0.88rem;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.45);
      padding: 11px 24px;
      width: auto;
      display: inline-block;
    }

    .btn-secondary::before {
      display: none;
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.7);
      box-shadow: none;
    }

    /* Grain texture overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
      opacity: 0.4;
    }

    @media (max-width: 520px) {
      .card {
        padding: 32px 24px;
        border-radius: 16px;
      }
      h1 {
        font-size: 1.5rem;
      }
      textarea {
        min-height: 140px;
      }
      .glow-1, .glow-2 {
        width: 300px;
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <div class="container">
    <div class="card">
      <div id="form-view">
        <div class="icon-row">
          <div class="icon-circle">&#128591;</div>
        </div>
        <h1>Oraciones sin respuestas</h1>
        <p class="subtitle">
          Ese pedido que hiciste y sentís que quedó en silencio. Dejalo acá.
        </p>

        <form id="prayer-form">
          <div class="form-group">
            <textarea
              id="prayer-text"
              placeholder="Escribí tu oración..."
              maxlength="2000"
              required
            ></textarea>
            <div class="textarea-footer">
              <span class="privacy-note">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                No se guarda ningún dato personal
              </span>
              <span class="char-count"><span id="char-count">0</span> / 2000</span>
            </div>
          </div>
          <button type="submit" id="submit-btn">Enviar</button>
        </form>
      </div>

      <div class="success-message" id="success-view">
        <div class="success-icon">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2>Recibida</h2>
        <p>Tu oración fue guardada. Gracias por compartirla.</p>
        <button class="btn-secondary" onclick="resetForm()">Escribir otra</button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('prayer-form');
    const textarea = document.getElementById('prayer-text');
    const charCount = document.getElementById('char-count');
    const charCountWrap = charCount.parentElement;
    const submitBtn = document.getElementById('submit-btn');
    const formView = document.getElementById('form-view');
    const successView = document.getElementById('success-view');

    textarea.addEventListener('input', () => {
      const len = textarea.value.length;
      charCount.textContent = len;
      charCountWrap.classList.toggle('active', len > 0);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const texto = textarea.value.trim();
      if (!texto) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando...';

      try {
        const res = await fetch('/api/oraciones', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ texto })
        });

        if (res.ok) {
          formView.style.display = 'none';
          successView.classList.add('show');
        } else {
          throw new Error('Error');
        }
      } catch (err) {
        alert('Hubo un error al enviar. Intentá de nuevo.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enviar';
      }
    });

    function resetForm() {
      textarea.value = '';
      charCount.textContent = '0';
      charCountWrap.classList.remove('active');
      successView.classList.remove('show');
      successView.style.display = 'none';
      formView.style.display = 'block';
      textarea.focus();
      // Reset display for next time
      setTimeout(() => { successView.style.display = ''; }, 50);
    }
  </script>
</body>
</html>
